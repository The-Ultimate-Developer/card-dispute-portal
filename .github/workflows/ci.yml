name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs ask for more only if they need it
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go.mod and go.sum are tidy
        working-directory: backend
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: disputes
          POSTGRES_PASSWORD: disputes
          POSTGRES_DB: disputes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disputes"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://disputes:disputes@localhost:5432/disputes?sslmode=disable
      COVERAGE_FLOOR: "50"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (race detector, no cache, real Postgres)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t + 0 < f + 0) }' \
            || { echo "::error::Coverage ${total}% is below the ${COVERAGE_FLOOR}% floor"; exit 1; }
      - name: Known vulnerabilities in dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (exactly what the lockfile says)
        run: npm ci --no-audit --no-fund
      - name: API types match the OpenAPI contract
        run: npm run check:api
      - name: Type check
        run: npm run typecheck
      - name: Lint (warnings fail the build)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Known vulnerabilities in shipped dependencies
        run: npm run audit:prod
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:${{ github.sha }}" .

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        timeout-minutes: 10
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --db-repository public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 \
            --timeout 5m \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "$IMAGE:${{ github.sha }}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push and capture digest
        id: push
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Pushed $REF"

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      # A deploy that silently does nothing must never show green.
      - name: Check deploy configuration
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          URL: ${{ vars.API_BASE_URL }}
        run: |
          [ -n "$HOOK" ] || { echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing from the production environment"; exit 1; }
          [ -n "$URL" ]  || { echo "::error::API_BASE_URL variable is missing from the production environment"; exit 1; }

      - name: Trigger Render deploy of the exact scanned image (by digest)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          REF: ${{ needs.image.outputs.ref }}
        run: |
          ENCODED=$(jq -rn --arg v "$REF" '$v|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}" > /dev/null
          echo "Deploy triggered for $REF"

      - name: Smoke test (wait until THIS commit is live and ready)
        env:
          URL: ${{ vars.API_BASE_URL }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 40); do
            LIVE=$(curl -fsS "$URL/version" | jq -r .version || true)
            if [ "$LIVE" = "$SHA" ] && curl -fsS "$URL/readyz" > /dev/null; then
              echo "Commit $SHA is live and ready"
              curl -fsS -o /dev/null "$URL/openapi.yaml" && echo "API docs served"
              exit 0
            fi
            echo "Live version: ${LIVE:-none}, waiting for $SHA..."
            sleep 15
          done
          echo "::error::$SHA not live and ready after 10 minutes"; exit 1

  deploy-frontend:
    # After the API: the API only ever gains fields, so a new frontend never meets an older API.
    needs: [frontend, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check deploy configuration
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE: ${{ secrets.NETLIFY_SITE_ID }}
          API: ${{ vars.API_BASE_URL }}
          WEB: ${{ vars.FRONTEND_URL }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::NETLIFY_AUTH_TOKEN secret is missing from the production environment"; exit 1; }
          [ -n "$SITE" ]  || { echo "::error::NETLIFY_SITE_ID secret is missing from the production environment"; exit 1; }
          [ -n "$API" ]   || { echo "::error::API_BASE_URL variable is missing from the production environment"; exit 1; }
          [ -n "$WEB" ]   || { echo "::error::FRONTEND_URL variable is missing from the production environment"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      # Netlify proxies /api to Render, so the browser sees one origin: the session
      # cookie stays first-party and the CSP can stay at connect-src 'self'.
      - name: Write routing rules
        env:
          API: ${{ vars.API_BASE_URL }}
        run: |
          printf '/api/*  %s/api/:splat  200\n/*  /index.html  200\n' "$API" > dist/_redirects
          cat dist/_redirects

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27.15.0 deploy --dir dist --prod --no-build --message "${{ github.sha }}"

      - name: Smoke test
        env:
          WEB: ${{ vars.FRONTEND_URL }}
        run: |
          curl -fsS "$WEB/" | grep -q '<div id="root">' && echo "App shell served"
          curl -fsS -o /dev/null "$WEB/staff/disputes" && echo "Client-side route falls back to index.html"
          curl -fsSI "$WEB/" | grep -qi '^content-security-policy:' && echo "Security headers present"
          STATUS=$(curl -s -o /tmp/me.json -w '%{http_code}' "$WEB/api/auth/me")
          [ "$STATUS" = "401" ] && grep -q '"code":"UNAUTHENTICATED"' /tmp/me.json \
            || { echo "::error::/api proxy is not reaching the API (got $STATUS)"; exit 1; }
          echo "API reachable through the proxy"
