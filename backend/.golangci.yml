version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose            # unclosed HTTP response bodies leak connections
    - errorlint            # correct use of errors.Is / errors.As / %w
    - gosec                # security issues
    - misspell
    - noctx                # HTTP requests without a context can't be cancelled
    - unconvert
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
