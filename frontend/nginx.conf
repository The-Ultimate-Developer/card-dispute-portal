# Serves the SPA and proxies /api to the Go service, so the browser only ever
# talks to one origin: the session cookie stays first-party and no CORS is needed.
# Netlify does the same job in production (see the generated _redirects).
#
# nginx drops inherited add_header lines in any location that sets its own,
# so each location includes the security headers explicitly.

server_tokens off;

upstream api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Fingerprinted by Vite: a new build gets new file names, so cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes all load index.html, which is never cached so a deploy is picked up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
